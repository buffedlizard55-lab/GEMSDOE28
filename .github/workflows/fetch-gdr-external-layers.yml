name: fetch-gdr-external-layers

# Why this workflow exists
# -----------------------
# The agent sandbox can only reach github.com / api.github.com / pypi.org / codeload.github.com.
# gdr.openei.org, mrdata.usgs.gov and sciencebase.usgs.gov are unreachable from it, so any hypothesis
# that needs an official external layer cannot be *verified as obtainable* from inside a session.
# A GitHub Actions runner can reach them. This workflow is that bridge: it downloads the specific
# free official files named in registry/sources.json, verifies each against a SHA-256 that was
# recorded by an independent runner on 2026-09-30 (sibling repository 16GEMSDOE,
# evidence/ci/external_verification.json), inventories them, clips them to the competition footprint
# and uploads the result as a run artifact.
#
# It commits small files back to the repository - evidence/external_layer_inventory.json plus any
# derived in-footprint clip under docs/data/ - because the agent sandbox cannot read run logs or
# download artifacts (both live on hosts outside its allowlist:
# results-receiver.actions.githubusercontent.com and *.blob.core.windows.net). Committing them is what
# makes the result verifiable AND usable from a session with `gh api`. None of those paths is in the
# push trigger's `paths:` filter, so the commit cannot re-trigger this workflow. It never contacts
# drivendata.org (the competition Terms of Use prohibit robots/automatic access; see
# scripts/refresh_source_feed.py).
#
# Session 10 addition: with DERIVED=all the job also downloads the pinned USGS slip/dilation-tendency
# release (H33-1, DOI 10.5066/P9YL58W6), re-verifies its SHA-256 against registry/external_pins.json,
# clips the vector layer to the competition footprint and commits docs/data/sb_slip_tendency_in_footprint
# .{csv,json}. A pin mismatch makes the job fail rather than commit a changed release silently.
#
# Session 11 addition: DERIVED=all now also clips the pin-verified USGS heat-flow release
# (H33-3/H35-2, DOI 10.5066/P9BZPVUC, 7,279-well point coverage with residual attributes) to
# docs/data/sb_heat_flow_in_footprint.{csv,json}; the availability probes cover all five MT
# conductance slices; and --dem-sizes HEADs the 716 USGS 3DEP 1 m tile URLs (sizes only, no tile
# bytes) into inventory dem_tile_sizes for the H33-4/H35-3 volume scoping gate.
#
# Retrieve the artifact from a session with:
#   gh run list --workflow=fetch-gdr-external-layers.yml
#   gh run download <run-id> --name gdr-external-layers --dir /tmp/gdr
#
# Manual review links (open in a browser, do not automate):
#   GDR 1391 (INGENIOUS regional data, DOI 10.15121/1881483) https://gdr.openei.org/submissions/1391
#   USGS State Geologic Map Compilation                       https://mrdata.usgs.gov/geology/state/
#   Siler et al. 2022 (DOI 10.5066/P9YL58W6)                  https://doi.org/10.5066/P9YL58W6

on:
  # Dispatching this workflow needs `actions: write`, which the agent's token does not have
  # (HTTP 403 on POST /actions/workflows/<id>/dispatches, recorded 2026-10-03). The push trigger below
  # is path-filtered to this workflow and its script, so merging a change to either runs the fetch
  # without anyone needing dispatch permission - and it still runs on demand for anyone who has it.
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-gdr-external-layers.yml"
      - "scripts/fetch_external_layers.py"
  workflow_dispatch:
    inputs:
      datasets:
        description: "Comma-separated dataset keys to fetch (all | paleo,probes,volcanics)"
        required: true
        default: "paleo,probes,volcanics"
      availability_only:
        description: "Also HEAD-check (no download) the larger sources and record status"
        required: false
        default: "true"
      derived:
        description: "Pin-verify and clip an official release to the footprint (all | one label | none)"
        required: false
        default: "all"

permissions:
  contents: write   # needed only to commit evidence/external_layer_inventory.json back to main:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geospatial readers
        run: |
          python -m pip install --upgrade pip
          # pyogrio ships GDAL wheels, so FileGDB and shapefile both read without apt packages.
          # geopandas is NOT optional: pyogrio.read_dataframe() raises
          # "ImportError: geopandas is required to use pyogrio.read_dataframe()" without it, which is
          # exactly what the 2026-10-03T18:54:08Z run hit after the magic-byte fix started opening the
          # archive. tests/test_external_bridge_derived.py asserts this line names geopandas.
          python -m pip install pyogrio shapely pyproj pandas geopandas

      - name: Assert the readers this job depends on actually import
        run: |
          python - <<'PYCHECK'
          import importlib
          for mod in ("pyogrio", "shapely", "pyproj", "pandas", "geopandas"):
              m = importlib.import_module(mod)
              print(f"{mod} {getattr(m, '__version__', '?')}")
          import pyogrio, geopandas  # noqa: F401  - the combination read_dataframe needs
          PYCHECK

      - name: Fetch the independent pin record (2026-09-30 runner)
        run: |
          mkdir -p /tmp/gdr
          curl -fsSL -o /tmp/gdr/pins.json \
            https://raw.githubusercontent.com/buffedlizard55-lab/16GEMSDOE/main/evidence/ci/external_verification.json
          python -c "import json;d=json.load(open('/tmp/gdr/pins.json'));print('pins:',len(d.get('downloads',d)))"

      - name: Show this repository's own ScienceBase pins (runner-recorded 2026-10-03)
        run: |
          python -c "import json;d=json.load(open('registry/external_pins.json'));[print(k, v['bytes'], v['sha256'][:16]) for k,v in d['downloads'].items()]"

      - name: Download, hash-verify, inventory and clip
        env:
          DATASETS: ${{ github.event.inputs.datasets || 'paleo,probes,volcanics' }}
          AVAIL_ONLY: ${{ github.event.inputs.availability_only || 'true' }}
          DERIVED: ${{ github.event.inputs.derived || 'all' }}
        run: |
          set -o pipefail   # a verification failure must fail the job, not be swallowed by tee
          mkdir -p /tmp/gdr/out
          python scripts/fetch_external_layers.py \
            --datasets "$DATASETS" \
            --availability-only "$AVAIL_ONLY" \
            --derived "$DERIVED" \
            --external-pins registry/external_pins.json \
            --dem-sizes data/dem_links.json \
            --out /tmp/gdr/out \
            --pins /tmp/gdr/pins.json \
            2>&1 | tee /tmp/gdr/log.txt
          # Fail loudly rather than committing an unusable derived table. Each of these is a real
          # defect, not an empty footprint: PIN_MISMATCH = the official release changed;
          # LAYER_UNREADABLE = GDAL could not open the layer (the 2026-10-03T18:49:01Z run hit this
          # because a ScienceBase URL has no file suffix, so the payload landed as .bin);
          # DERIVED_EMPTY = parsed but nothing intersects the bbox; NO_VECTOR_LAYER / ARCHIVE_UNREADABLE
          # = the archive is not what the pin says it is.
          for bad in PIN_MISMATCH LAYER_UNREADABLE DERIVED_EMPTY NO_VECTOR_LAYER ARCHIVE_UNREADABLE; do
            if grep -q "\"status\": \"$bad\"" /tmp/gdr/out/inventory.json; then
              echo "::error::derived-clip defect: $bad" && exit 1
            fi
          done

      - name: Show inventory in the run log
        if: always()
        run: |
          echo "===== inventory ====="
          cat /tmp/gdr/out/inventory.json || echo "(no inventory produced)"

      - name: Commit the inventory so a session can read it with gh api
        if: always()
        run: |
          if [ ! -f /tmp/gdr/out/inventory.json ]; then
            echo "no inventory produced; nothing to commit"; exit 0
          fi
          cp /tmp/gdr/out/inventory.json evidence/external_layer_inventory.json
          if [ -d /tmp/gdr/out/commit ]; then
            mkdir -p docs/data
            cp -f /tmp/gdr/out/commit/* docs/data/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/external_layer_inventory.json docs/data
          if git diff --cached --quiet; then
            echo "inventory unchanged; nothing to commit"
          else
            git commit -F - <<'COMMIT_MSG'
          evidence: external-layer inventory + derived in-footprint clips

          Written by .github/workflows/fetch-gdr-external-layers.yml on the runner, because run logs
          and artifacts are hosted outside the agent sandbox's allowlist and cannot be read from a
          session. Every dataset row carries the pin it was checked against and whether it matched.
          Derived clips under docs/data/ (see inventory sciencebase_derived for per-label status):
          sb_slip_tendency_in_footprint.{csv,json} from the pin-verified USGS
          slip/dilation-tendency release (DOI 10.5066/P9YL58W6) for H33-1, and
          sb_heat_flow_in_footprint.{csv,json} from the pin-verified USGS heat-flow release
          (DOI 10.5066/P9BZPVUC) for H33-3/H35-2; attributes are copied verbatim from the
          release and no field is derived. Inventory dem_tile_sizes HEADs the 716 USGS 3DEP
          1 m tile URLs (no tile bytes downloaded) for the H33-4/H35-3 volume scoping gate.
          COMMIT_MSG
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdr-external-layers
          path: |
            /tmp/gdr/out/inventory.json
            /tmp/gdr/out/*.csv
            /tmp/gdr/out/commit/*
            /tmp/gdr/log.txt
          if-no-files-found: warn
          retention-days: 90
