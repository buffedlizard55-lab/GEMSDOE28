permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build pages without network access
        run: python scripts/build_site.py
      - name: Require generated pages to be current
        run: git diff --exit-code -- docs/*.html docs/data/current_run_card_2026-10-26.json docs/data/run_card_2026-10-26.json docs/data/run_card_s19.json index.html executive-summary.html data/current_run_card_2026-10-26.json
