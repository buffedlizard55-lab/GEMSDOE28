permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build pages without network access
        run: python scripts/build_site.py && python scripts/build_active_review.py
      - name: Require generated pages to be current
        run: git diff --exit-code -- docs/*.html docs/s25/index.html docs/data/*run_card*.json docs/data/s24_repository_review_run_card.json docs/data/active_checkout_review_2026-10-27.json index.html executive-summary.html current-review.html data/current_run_card*.json
