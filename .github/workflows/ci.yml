name: CI (tests, lint, site build)

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check src scripts tests
      - run: python -m pytest -q
      - name: Site builds from JSON only and generated pages are current
        run: |
          python scripts/build_site.py
          git diff --exit-code -- docs/*.html index.html executive-summary.html data/current_run_card_2026-10-25.json data/current_run_card_2026-10-26.json
